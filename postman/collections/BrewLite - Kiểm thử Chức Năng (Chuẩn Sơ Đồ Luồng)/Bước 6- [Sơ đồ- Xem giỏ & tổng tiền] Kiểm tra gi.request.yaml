$kind: http-request
name: "Bước 6: [Sơ đồ: Xem giỏ & tổng tiền] Kiểm tra giỏ hàng (GET /cart)"
url: "{{base_url}}/cart"
method: GET
headers:
  Authorization: Bearer {{jwt_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("[6. Xem giỏ] Lấy giỏ hàng thành công & tự tính tổng tiền", function () {
          pm.response.to.have.status(200);
          var cart = pm.response.json();
          pm.expect(cart).to.have.property('items');
          pm.expect(cart.items.length).to.be.above(0);
      });
    language: text/javascript
order: 6000
