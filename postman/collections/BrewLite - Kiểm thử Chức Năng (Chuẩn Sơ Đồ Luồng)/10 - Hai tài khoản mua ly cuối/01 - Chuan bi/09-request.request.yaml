$kind: http-request
name: 08 — Hai đơn PENDING chưa làm giảm kho
url: '{{baseUrl}}/admin/ingredients/{{lastIngredientId}}'
method: GET
auth:
  type: noauth
headers:
  Authorization: Bearer {{lastAdminToken}}
scripts:
- type: afterResponse
  code: |-
    (function () {
    pm.test('HTTP 200', function(){pm.response.to.have.status(200);});
    const data=pm.response.json();
    pm.test('Kho vẫn 1 vì chỉ trừ khi PAID',function(){pm.expect(data.quantity).to.equal(1);});
    })();
  language: text/javascript
order: 9000
