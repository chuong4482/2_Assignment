$kind: http-request
name: "Bước 1: [Sơ đồ: Xem menu] Lấy danh sách đồ uống (GET /products)"
url: "{{base_url}}/products"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("[1. Xem menu] Trả về mã HTTP 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("[1. Xem menu] Danh sách đồ uống hiển thị đầy đủ tên, giá, hình", function () {
          var products = pm.response.json();
          pm.expect(products).to.be.an('array');
          pm.expect(products.length).to.be.above(0);
          
          var first = products[0];
          pm.expect(first).to.have.property('id');
          pm.expect(first).to.have.property('name');
          pm.expect(first).to.have.property('price');
          
          pm.collectionVariables.set("product_id", first.id);
      });
    language: text/javascript
order: 1000
