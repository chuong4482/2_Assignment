$kind: http-request
name: "NFR-06: Task 10 - Kiểm tra tính bất biến Idempotency trong thanh toán (POST /payments)"
url: http://localhost:4000/payments
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: IDEMP-KEY-TEST-2026
body:
  type: text
  content: |-
    {
        "orderId": "cmvcf7i6j0006ur2cmmg7bab7",
        "method": "VNPAY",
        "amount": 45000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("[NFR-06] Endpoint thanh toán phản hồi < 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });

      pm.test("[NFR-06] Kiểm tra mã trạng thái hợp lệ của giao dịch Idempotent", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 400, 401, 404, 409]);
      });
    language: text/javascript
order: 6000
