$kind: http-request
name: "NFR-02: Bảo mật - Chặn truy cập khi thiếu JWT (GET /orders/me)"
url: http://localhost:4000/orders/me
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("[NFR-02] Bắt buộc có JWT Token: Phải trả về 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });

      pm.test("[NFR-02] Thời gian phản hồi kiểm tra bảo mật < 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 2000
