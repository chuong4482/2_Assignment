$kind: http-request
name: "NFR-03: Bảo mật - Chặn khi JWT Token sai hoặc giả mạo (GET /orders/me)"
url: http://localhost:4000/orders/me
method: GET
headers:
  Authorization: Bearer jwt_gia_mao_token_khong_hop_le
