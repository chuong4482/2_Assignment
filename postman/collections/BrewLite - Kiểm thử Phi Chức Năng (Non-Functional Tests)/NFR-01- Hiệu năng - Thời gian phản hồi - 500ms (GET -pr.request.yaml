$kind: http-request
name: "NFR-01: Hiệu năng - Thời gian phản hồi < 500ms (GET /products)"
url: http://localhost:4000/products
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("[NFR-01] Thời gian phản hồi API < 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });

      pm.test("[NFR-01] Trả về mã thành công 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("[NFR-01] Dữ liệu mẫu dạng mảng và có phần tử", function () {
          var data = pm.response.json();
          pm.expect(data).to.be.an('array');
          pm.expect(data.length).to.be.above(0);
      });
    language: text/javascript
order: 1000
