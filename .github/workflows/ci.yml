name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: brewlite_assignment1_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U brewlite_test -d brewlite_assignment1_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://brewlite_test:test_only_password@127.0.0.1:55432/brewlite_assignment1_test?schema=public
      JWT_SECRET: assignment1-isolated-test-jwt-key
      STAFF_KEY: local-staff-key-change-me
      ADMIN_EMAIL: admin@brewlite.local
      ADMIN_PASSWORD: Admin123!
      VNPAY_TMN_CODE: TESTONLY
      VNPAY_HASH_SECRET: assignment1-isolated-test-signing-key
      VNPAY_RETURN_URL: http://localhost:4100/payments/vnpay/return
      WEB_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://localhost:4100
      TEST_API_URL: http://localhost:4100
      TEST_WEB_URL: http://localhost:3100
      PORT: '4100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:deploy && npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: Start isolated API
        run: |
          npm run start:prod -w apps/api > /tmp/brewlite-api.log 2>&1 &
          for i in $(seq 1 30); do
            echo "Waiting for test API ($i/30)"
            if curl --fail http://localhost:4100/health/ready; then exit 0; fi
            sleep 2
          done
          cat /tmp/brewlite-api.log
          exit 1
      - run: npm run test:integration
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: tests/test-results
